name: 打包发布 Release

# 触发方式：
#  1. 推送 v 开头的标签（推荐）：git tag v1.1.0 && git push origin v1.1.0
#  2. 手动触发：仓库 Actions 页面 → 选本工作流 → Run workflow
# 说明：Release 的版本号取自 src-tauri/tauri.conf.json 的 version，
#       请保证 tag 与该 version 保持一致（tag 需以 v 开头，如 v1.1.0）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 编译缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 构建并上传到 Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'PM 待办助手 v__VERSION__'
          releaseBody: 'Windows 安装包见下方 Assets，下载 *_x64-setup.exe 运行即可。数据仅存本机。'
          releaseDraft: false
          prerelease: false

      # 构建机的系统编码不支持非 ASCII 文件名，中文产品名会被替换成点号，
      # 这里通过 GitHub API 把安装包重命名为正确的中文名。
      # 注意：产品名必须从 tauri.conf.json 读取（UTF-8 文件），不能在脚本里写中文
      # 字面量——run 脚本里的非 ASCII 字符在构建机上会被损坏。
      - name: 修正安装包文件名
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $conf = Get-Content -Raw -Encoding UTF8 src-tauri/tauri.conf.json | ConvertFrom-Json
          $target = "$($conf.productName)_$($conf.version)_x64-setup.exe"
          Write-Host "target asset name: $target"
          $rel = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" | ConvertFrom-Json
          # 先删掉与目标同名的旧资产（同版本重复发布会 422 冲突）
          foreach ($a in @($rel.assets)) {
            if ($a.name -eq $target) {
              gh api -X DELETE "repos/$env:GITHUB_REPOSITORY/releases/assets/$($a.id)" | Out-Null
              Write-Host "deleted old asset: $($a.name)"
            }
          }
          # 再把编码损坏的安装包重命名为正确名字
          $rel2 = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" | ConvertFrom-Json
          foreach ($a in @($rel2.assets)) {
            if ($a.name -like '*setup.exe' -and $a.name -ne $target) {
              gh api -X PATCH "repos/$env:GITHUB_REPOSITORY/releases/assets/$($a.id)" -f name="$target" | Out-Null
              Write-Host "renamed: $($a.name) -> $target"
            }
          }
