name: 打包发布 Release

# 触发方式：
#  1. 推送 v 开头的标签（推荐）：git tag v1.1.0 && git push origin v1.1.0
#  2. 手动触发：仓库 Actions 页面 → 选本工作流 → Run workflow
# 说明：Release 的版本号取自 src-tauri/tauri.conf.json 的 version，
#       请保证 tag 与该 version 保持一致（tag 需以 v 开头，如 v1.1.0）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 编译缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 构建并上传到 Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'PM 待办助手 v__VERSION__'
          releaseBody: 'Windows 安装包见下方 Assets，下载 *_x64-setup.exe 运行即可。数据仅存本机。'
          releaseDraft: false
          prerelease: false

      # GitHub 的 Release 资产文件名不支持非 ASCII 字符（会静默替换成点号），
      # 所以安装包文件名统一用 ASCII，中文展示放在资产 label 里（label 支持中文）。
      # 中文一律从 tauri.conf.json 读取，脚本内不要写中文字面量（run 脚本的非
      # ASCII 字符在构建机上可能被损坏）。
      - name: 规范化 Release 资产名称
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INSTALLER_BASE: PMTodoAssistant
        shell: pwsh
        run: |
          function Assert-Ok($what) {
            if ($LASTEXITCODE -ne 0) { Write-Host "::error::$what failed"; exit 1 }
          }
          $conf = Get-Content -Raw -Encoding UTF8 src-tauri/tauri.conf.json | ConvertFrom-Json
          $rel = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" | ConvertFrom-Json
          Assert-Ok "fetch release"
          $ver = $rel.tag_name.TrimStart("v")
          $target = "$($env:INSTALLER_BASE)_$($ver)_x64-setup.exe"
          $label = "$($conf.productName) v$ver (Windows x64)"
          Write-Host "target name: $target / label: $label"
          $asset = $rel.assets | Where-Object { $_.name -like '*setup.exe' } | Select-Object -First 1
          if (-not $asset) { Write-Host "::error::no setup.exe asset found"; exit 1 }
          if ($asset.name -eq $target) {
            Write-Host "asset already named correctly"
          } else {
            gh api -X PATCH "repos/$env:GITHUB_REPOSITORY/releases/assets/$($asset.id)" -f name="$target" | Out-Null
            Assert-Ok "rename asset"
            Write-Host "renamed: $($asset.name) -> $target"
          }
          $body = @{ label = $label } | ConvertTo-Json
          $tmp = New-TemporaryFile
          Set-Content -Path $tmp -Value $body -Encoding UTF8
          gh api -X PATCH "repos/$env:GITHUB_REPOSITORY/releases/assets/$($asset.id)" --input $tmp -H "Content-Type: application/json" | Out-Null
          Assert-Ok "set asset label"
          Write-Host "label set: $label"
