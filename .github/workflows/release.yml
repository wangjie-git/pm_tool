name: 打包发布 Release

# 触发方式：
#  1. 推送 v 开头的标签（推荐）：git tag v1.1.0 && git push origin v1.1.0
#  2. 手动触发：仓库 Actions 页面 → 选本工作流 → Run workflow
# 说明：Release 的版本号取自 src-tauri/tauri.conf.json 的 version，
#       请保证 tag 与该 version 保持一致（tag 需以 v 开头，如 v1.1.0）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 编译缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 构建并上传到 Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'PM 待办助手 v__VERSION__'
          releaseBody: 'Windows 安装包见下方 Assets，下载 *_x64-setup.exe 运行即可。数据仅存本机。'
          releaseDraft: false
          prerelease: false

      # 构建机的系统编码不支持非 ASCII 文件名，中文产品名会被替换成点号，
      # 这里通过 GitHub API 把安装包重命名为正确的中文名（API 走 UTF-8，不受影响）。
      - name: 修正安装包文件名
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $target = "PM待办助手_$($conf.version)_x64-setup.exe"
          $rel = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" | ConvertFrom-Json
          foreach ($a in $rel.assets) {
            if ($a.name -like '*setup.exe' -and $a.name -ne $target) {
              gh api -X PATCH "repos/$env:GITHUB_REPOSITORY/releases/assets/$($a.id)" -f name="$target"
              Write-Host "重命名 $($a.name) -> $target"
            }
          }
